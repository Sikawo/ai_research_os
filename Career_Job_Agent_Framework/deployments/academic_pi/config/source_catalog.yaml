    priority: 90
    frequency_class: high
    discovery_method: rss_feed
    supports_email_alerts: false
    supports_direct_search: true
    supports_rss: true
    feed_urls:
      - https://academicjobsonline.org/ajo?joblist-0-0-0-1----rss--
      - https://academicjobsonline.org/ajo?joblist-0-0-0-200----rss--
    bootstrap_url: https://academicjobsonline.org/ajo/jobs/job
    alert_delivery_state: null
    verification_authority: discovery_only
    expected_update_cadence: daily
    parser_version: 2

