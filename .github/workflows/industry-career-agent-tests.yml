name: Phase 6A public capability tests

on:
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - ".gitignore"
      - ".github/workflows/industry-career-agent-tests.yml"
      - "Career_Job_Agent_Framework/**"
      - "Docs/**"
      - "Scripts/**"
      - "Templates/**"
      - "manifests/phase6a_transfer_allowlist.yaml"
      - "plugins/**"
      - "requirements-dev.txt"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".agents/plugins/marketplace.json"
      - ".gitignore"
      - "Career_Job_Agent_Framework/**"
      - "Docs/**"
      - "Scripts/**"
      - "Templates/**"
      - "manifests/phase6a_transfer_allowlist.yaml"
      - "plugins/**"
      - "requirements-dev.txt"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML
      - name: Compile
        run: python -m compileall Career_Job_Agent_Framework Scripts tests
      - name: Unit tests
        run: python -m pytest -q -p no:cacheprovider
