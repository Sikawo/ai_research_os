name: Research Workflows plugin tests

on:
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/research-workflows-tests.yml"
      - "manifests/phase13_research_workflows_allowlist.yaml"
      - "plugins/research-workflows/**"
      - "Scripts/validate_repository_safety.py"
      - "tests/test_phase13_research_workflows.py"
      - "tests/test_repository_safety.py"
  push:
    branches: [main]
    paths:
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/research-workflows-tests.yml"
      - "manifests/phase13_research_workflows_allowlist.yaml"
      - "plugins/research-workflows/**"
      - "Scripts/validate_repository_safety.py"
      - "tests/test_phase13_research_workflows.py"
      - "tests/test_repository_safety.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run Research Workflows integration tests
        run: python3 -m pytest -q -p no:cacheprovider tests/test_phase13_research_workflows.py tests/test_repository_safety.py plugins/research-workflows/skills/*/tests
      - name: Run public repository safety
        run: python3 Scripts/validate_repository_safety.py --phase working-tree
